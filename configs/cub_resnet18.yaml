project:
  name: feature_genesis_cub
  run_dir: runs/cub_resnet18_seed1729
  seed: 1729
  device: cuda
reproducibility:
  strict: true
  deterministic_algorithms: true
  warn_only: false
  allow_tf32: false
  cudnn_benchmark: false
  cpu_threads: 1
  verify_environment: true
data:
  name: cub200
  image_size: 160
  batch_size: 64
  eval_batch_size: 128
  num_workers: 4
  split_seed: 8191
  validation_per_class: 3
  bbox_margin: 0.12
  train_scale_min: 0.72
  train_scale_max: 1.0
  horizontal_flip_probability: 0.5
  color_jitter: 0.12
model:
  name: resnet18_gn
  num_classes: 200
  hook_layer: layer3
  group_norm_groups: 32
train:
  epochs: 100
  max_steps: 7000
  learning_rate: 0.08
  min_learning_rate: 0.00001
  warmup_steps: 400
  momentum: 0.9
  weight_decay: 0.0005
  label_smoothing: 0.1
  anchor_every: 500
  log_every: 20
  analysis_steps: [0, 25, 50, 100, 200, 400, 800, 1600, 3200, 4800, 6400, 7000]
  gradient_clip_norm: null
activations:
  split: train
  max_images: 3000
  batch_size: 96
  dtype: float16
  flatten_spatial: true
  cache_dir: activations
  checkpoint_steps: [0, 25, 50, 100, 200, 400, 800, 1600, 3200, 4800, 6400, 7000]
  random_spatial_tokens_per_image: 0
sae:
  kind: batch_topk
  expansion_factor: 16
  dictionary_size: 4096
  k: 16
  batch_size: 8192
  steps: 5000
  learning_rate: 0.0003
  min_learning_rate: 0.00001
  warmup_steps: 200
  weight_decay: 0.0
  aux_weight: 0.03125
  aux_k: 256
  dead_steps: 200
  matryoshka_prefixes: [256, 1024, 4096]
  matryoshka_weights: [0.2, 0.3, 0.5]
  temporal_weight: 0.002
  cosine_per_feature: true
  jump_sparsity_coefficient: 0.001
  jump_initial_threshold: 0.1
  jump_initial_l0: 16
  jump_bandwidth: 0.05
  jump_sparsity_warmup_steps: 500
  threshold_ema: 0.99
  mp_steps: 16
  mp_residual_tolerance: 0.0
  input_normalization: dataset_rms
  initialization_samples: 32768
  checkpoint_every: 500
  gradient_clip_norm: 1.0
  artifact_version: v2_repaired
  seeds: [0, 1, 2]
  primary_seed: 0
  warm_start_mode: aligned_directions
  warm_start_alignment_rows: 50000
  selection_fraction: 0.1
  calibration_fraction: 0.05
  evaluation_fraction: 0.1
  minimum_fraction_variance_explained: 0.8
  maximum_dead_fraction: 0.5
  minimum_mean_l0_fraction: 0.5
  maximum_mean_l0_fraction: 2.0
  minimum_cross_seed_cosine: 0.5
  minimum_cross_seed_match_fraction: 0.1
lineage:
  decoder_weight: 0.35
  activation_weight: 0.35
  concept_weight: 0.3
  continue_threshold: 0.72
  secondary_threshold: 0.56
  split_mass_threshold: 1.15
  death_frequency_threshold: 0.00001
  procrustes_samples: 50000
attribution:
  feature_ids: []
  target_steps: [7000]
  candidate_batches: 24
  exact_replay_batches: 8
  gradient_refresh_steps: 25
  replay_start_step: 6400
  replay_end_step: 7000
  intervention: mask_loss
  parameter_scope: hook_block
  probe_images: 256
evaluation:
  top_examples: 24
  max_features: 512
  minimum_activations: 20
  part_radius_fraction: 0.12
  report_dir: reports
  gemini_enabled: true
  gemini_model: gemini-3.6-flash
  gemini_thinking_level: MEDIUM
  gemini_env_path: .env
  gemini_prompt_version: feature-genesis-multimodal-v2
  gemini_parallel_requests: 3
  gemini_request_attempts: 6
  gemini_timeout_seconds: 180
  gemini_max_features: 16
  gemini_feature_ids: []
  gemini_maximum_image_frequency: 0.8
  gemini_diversity_penalty: 0.15
  gemini_top_positives: 8
  gemini_borderline_positives: 4
  gemini_hard_negatives: 4
  gemini_validation_positives: 4
  gemini_validation_negatives: 4
  gemini_minimum_validation_auc: 0.65
  gemini_minimum_confidence: 0.6
  gemini_minimum_positive_fit: 0.5
