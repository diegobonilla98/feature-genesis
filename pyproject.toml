[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-genesis"
version = "0.1.0"
description = "Deterministic causal microscope for studying learned feature genesis during training."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0",
    "networkx>=3.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyarrow>=20.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
